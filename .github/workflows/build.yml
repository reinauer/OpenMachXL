name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            architecture: x86_64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
          - runner: macos-15-intel
            platform: macos-x86_64
            architecture: x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 3

      # The excluded cases read DOS archives that are not in this repository.
      - name: Run self-contained regression tests
        run: |
          ctest --test-dir build --output-on-failure --parallel 3 \
            --exclude-regex '^(original_pla_equivalence|original_corpus_functions|native_automatic_fitter|complete_archive_compatibility)$'

      - name: Package
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="git-${GITHUB_SHA:0:12}"
          fi
          version="${version//\//-}"
          package="machxl-${version}-${PACKAGE_PLATFORM}"
          cmake --install build --prefix "$PWD/package/$package"
          cp README.md "package/$package/"
          mkdir -p dist
          tar -C package -czf "dist/$package.tar.gz" "$package"
          tar -tzf "dist/$package.tar.gz"

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: machxl-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
